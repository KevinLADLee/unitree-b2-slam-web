# Supervisor 配置文件
# 将此文件复制到 /etc/supervisor/conf.d/unitree-slam.conf

[program:unitree-slam-backend]
# 启动脚本
command=/opt/unitree-slam/backend/start.sh

# 工作目录
directory=/opt/unitree-slam/backend

# 运行用户（请根据实际情况修改）
user=unitree

# 自动启动
autostart=true

# 自动重启
autorestart=true

# 启动重试次数
startretries=3

# 停止信号
stopsignal=TERM

# 停止超时时间（秒）
stopwaitsecs=10

# 日志配置
stdout_logfile=/var/log/supervisor/unitree-slam-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/unitree-slam-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

# 环境变量
environment=PATH="/opt/unitree-slam/backend/.venv/bin:%(ENV_PATH)s"

# 优先级
priority=999

# 进程名
process_name=%(program_name)s
